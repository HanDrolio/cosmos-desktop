name: Publish COSM.OS Desktop v0.7.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.7.yml

permissions:
  contents: write

concurrency:
  group: publish-cosmos-desktop-v0.7
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        shell: pwsh
        run: |
          @"
          # Active release workflow

          Run ID: $env:GITHUB_RUN_ID
          Commit: $env:GITHUB_SHA
          "@ | Set-Content WORKFLOW-RUN.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WORKFLOW-RUN.md
          git commit -m "Record active v0.7.0 release workflow"
          git push origin HEAD:main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check js/app.js
          node --check js/desktop-ai.js
          node --check js/model-settings.js
          node --check js/voice-controller.js
          node --check js/persona-prompts.js
          node --check js/personas.js
          node --check desktop/main.js
          node --check desktop/preload.js

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/COSM.OS-Setup-0.7.0.exe", "README.md", "CHANGELOG.md" `
            -DestinationPath "COSM.OS-Windows-0.7.0.zip" `
            -Force

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          ## COSM.OS Desktop v0.7.0 — Pure Signal Reset

          A private Windows desktop AI journal and conversation system powered by local Ollama models.

          ### Highlights
          - Nine compact personas
          - Chat Mode with only three raw exchanges of context
          - One-shot Log Mode
          - Deterministic `remember`, `summary`, and `plan` commands
          - Local model selection and generation presets
          - Local chats, logs, import, and export
          - No cloud account required

          ### Setup
          1. Install and run Ollama.
          2. Pull a model such as `qwen2.5:3b`.
          3. Run the attached Windows installer.

          The installer is unsigned and may trigger Microsoft SmartScreen.
          "@ | Set-Content RELEASE-NOTES.md

      - name: Replace v0.7.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.7.0 --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous v0.7.0 release found; creating a new one."
          }

          gh release create v0.7.0 `
            "dist/COSM.OS-Setup-0.7.0.exe" `
            "COSM.OS-Windows-0.7.0.zip" `
            --title "COSM.OS Desktop v0.7.0" `
            --notes-file "RELEASE-NOTES.md" `
            --target main

      - name: Record successful publication
        shell: pwsh
        run: |
          @"
          # Release status

          **COSM.OS Desktop v0.7.0 was built and published successfully.**

          Release assets:

          - `COSM.OS-Setup-0.7.0.exe`
          - `COSM.OS-Windows-0.7.0.zip`

          Verified source version: `0.7.0`
          Workflow run: $env:GITHUB_RUN_ID
          "@ | Set-Content RELEASE-STATUS.md

          git add RELEASE-STATUS.md
          git commit -m "Record successful v0.7.0 release"
          git push origin HEAD:main
