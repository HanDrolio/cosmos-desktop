name: Publish COSM.OS Desktop v0.7.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.7.yml

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: windows-latest

    steps:
      - name: Check out desktop repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out verified v0.7 source
        uses: actions/checkout@v4
        with:
          repository: HanDrolio/handrolio.github.io
          ref: 94921d635ad8f5d69f3e8560257e5c947351e9e1
          path: upstream
          persist-credentials: false

      - name: Sync application source
        shell: pwsh
        run: |
          $files = @(
            'index.html',
            'manifest.webmanifest',
            'sw.js',
            'package.json'
          )

          foreach ($file in $files) {
            Copy-Item "upstream/$file" $file -Force
          }

          $directories = @('css', 'desktop', 'js')
          foreach ($directory in $directories) {
            if (Test-Path $directory) {
              Remove-Item $directory -Recurse -Force
            }
            Copy-Item "upstream/$directory" $directory -Recurse -Force
          }

          Remove-Item upstream -Recurse -Force

      - name: Commit synced source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js package.json css desktop js
          if (-not (git diff --cached --quiet)) {
            git commit -m "Import COSM.OS Desktop v0.7.0 source"
            git push origin HEAD:main
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check js/app.js
          node --check js/desktop-ai.js
          node --check js/model-settings.js
          node --check js/voice-controller.js
          node --check js/persona-prompts.js
          node --check js/personas.js
          node --check desktop/main.js
          node --check desktop/preload.js

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/COSM.OS-Setup-0.7.0.exe", "README.md", "CHANGELOG.md" `
            -DestinationPath "COSM.OS-Windows-0.7.0.zip" `
            -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          name: COSM.OS Desktop v0.7.0
          target_commitish: main
          make_latest: true
          generate_release_notes: false
          body: |
            ## COSM.OS Desktop v0.7.0 — Pure Signal Reset

            A private Windows desktop AI journal and conversation system powered by local Ollama models.

            ### Highlights
            - Nine compact personas
            - Chat Mode with only three raw exchanges of context
            - One-shot Log Mode
            - Deterministic `remember`, `summary`, and `plan` commands
            - Local model selection and generation presets
            - Local chats, logs, import, and export
            - No cloud account required

            ### Setup
            1. Install and run Ollama.
            2. Pull a model such as `qwen2.5:3b`.
            3. Run the Windows installer attached below.

            The installer is unsigned and may trigger Microsoft SmartScreen.
          files: |
            dist/COSM.OS-Setup-0.7.0.exe
            COSM.OS-Windows-0.7.0.zip
          fail_on_unmatched_files: true
          overwrite_files: true
